<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>肩颈测量交互 Demo</title>
  <style>
    :root {
      --black: #050607;
      --blue: #087cf0;
      --cyan: #0094ff;
      --panel: #555;
      --panel-dark: #172027;
      --card: #202a32;
      --text: #f5f7fb;
      --muted: #8b96a1;
      --orange: #ff9200;
      --green: #10d329;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 14px;
      padding: 20px;
      background: #eef1f5;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--text);
    }

    .phone {
      width: min(390px, calc(100vw - 28px));
      aspect-ratio: 390 / 660;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 55% 42%, rgba(0, 116, 255, .14), transparent 26%),
        var(--black);
      border: 1px solid #1a1f24;
      box-shadow: 0 18px 46px rgba(0, 0, 0, .28);
    }

    .screen {
      position: absolute;
      inset: 0;
      padding: 22px 20px 18px;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #d7dce3;
      font-size: 13px;
      height: 16px;
    }

    .sys-icons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sig {
      width: 14px;
      height: 10px;
      border-left: 2px solid #d7dce3;
      border-top: 2px solid #d7dce3;
      border-radius: 10px 0 0 0;
      transform: rotate(30deg);
      opacity: .9;
    }

    .battery {
      width: 14px;
      height: 8px;
      border: 1px solid #e6edf4;
      border-radius: 1px;
      position: relative;
    }

    .battery::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 7px;
      height: 2px;
      background: var(--green);
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #e6edf4;
    }

    .back {
      margin-top: 28px;
      color: #5ea7ff;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    h1 {
      margin: 38px 0 24px;
      text-align: center;
      font-size: 25px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .measure-title {
      margin: 24px 0 0;
      text-align: left;
      font-size: 22px;
      font-weight: 600;
    }

    .sub {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .progress-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--cyan);
    }

    .rail {
      width: 72px;
      height: 4px;
      border-radius: 999px;
      overflow: hidden;
      background: #17202a;
    }

    .fill {
      height: 100%;
      width: var(--p, 0%);
      background: var(--cyan);
      border-radius: inherit;
    }

    .project-list {
      display: grid;
      gap: 14px;
      padding-bottom: 48px;
    }

    .project-card {
      border: 0;
      width: 100%;
      min-height: 92px;
      padding: 18px 24px;
      text-align: left;
      border-radius: 10px;
      color: #f4f7fb;
      background: #555;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      font: inherit;
    }

    .project-card.primary {
      min-height: 178px;
      background: var(--blue);
    }

    .project-card::before {
      content: "";
      position: absolute;
      left: 24px;
      top: 38px;
      width: 4px;
      height: 30px;
      background: var(--cyan);
    }

    .project-card.primary::before {
      background: #fff;
      top: 42px;
    }

    .project-name {
      margin-left: 24px;
      font-size: 22px;
      font-weight: 500;
    }

    .project-desc {
      margin: 20px 0 0 24px;
      color: rgba(255,255,255,.76);
      font-size: 15px;
      line-height: 1.55;
    }

    .project-figure {
      position: absolute;
      right: 26px;
      bottom: 18px;
      transform: scale(.62);
      transform-origin: right bottom;
    }

    .project-small-figure {
      position: absolute;
      right: 30px;
      top: 18px;
      color: #dfe7ef;
      font-size: 46px;
      opacity: .86;
    }

    .home-timer, .bottom-timer {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 14px;
      display: grid;
      gap: 7px;
      text-align: center;
      color: #929aa4;
      font-size: 11px;
    }

    .home-timer strong, .bottom-timer strong { color: var(--orange); }

    .bottom-line {
      height: 5px;
      border-radius: 999px;
      background: var(--blue);
    }

    .stepbar {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      min-height: 66px;
      background: var(--panel-dark);
      border: 1px solid rgba(0, 148, 255, .5);
      border-radius: 8px;
      overflow: hidden;
    }

    .stepbar.shoulder-stagebar {
      grid-template-columns: repeat(2, 1fr);
      min-height: 52px;
    }

    .step {
      padding: 10px 4px 8px;
      text-align: center;
      color: #697681;
      border-right: 1px solid rgba(255,255,255,.04);
    }

    .step:last-child { border-right: 0; }
    .step.active { color: #fff; background: rgba(0, 148, 255, .12); }
    .step.done { color: #d7e2ec; }

    .step .label {
      min-height: 22px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
    }

    .mark {
      margin-right: 2px;
      color: #fff;
      font-size: 10px;
    }

    .value {
      color: var(--cyan);
      font-size: 12px;
      margin-top: 8px;
    }

    .shoulder-angle-result {
      position: absolute;
      top: 102px;
      color: #e6edf5;
      font-size: 17px;
      font-weight: 500;
      text-shadow: 0 0 10px rgba(255, 255, 255, .24);
      z-index: 4;
    }

    .shoulder-angle-result.left {
      left: 26px;
    }

    .shoulder-angle-result.right {
      right: 26px;
    }

    .countdown {
      position: absolute;
      left: 0;
      right: 0;
      top: 180px;
      height: 210px;
      display: grid;
      place-items: center;
      font-size: 135px;
      font-weight: 300;
      color: #fff;
      text-shadow: 0 0 34px rgba(0, 132, 255, .64);
    }

    .stage {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 220px;
      bottom: 150px;
      display: grid;
      place-items: end center;
    }

    .stage.neck-stage {
      top: 194px;
      bottom: 164px;
    }

    .stage.apose-stage {
      top: 142px;
      bottom: 150px;
      display: block;
    }

    .stage.scan-stage {
      top: 184px;
      bottom: 154px;
    }

    .stage.wait-stage {
      top: 246px;
      bottom: 210px;
      display: grid;
      place-items: center;
    }

    .orbit {
      position: absolute;
      width: 178px;
      height: 178px;
      border-radius: 50%;
      border: 2px dashed rgba(224, 232, 243, .28);
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
    }

    .angle-line {
      position: absolute;
      left: 50%;
      bottom: 98px;
      width: 2px;
      height: 142px;
      transform-origin: bottom center;
      transform: rotate(var(--line-rot, 0deg));
      opacity: var(--line-op, 0);
      background: repeating-linear-gradient(to bottom, var(--orange) 0 4px, transparent 4px 8px);
    }

    .person {
      position: relative;
      width: 126px;
      height: 270px;
      filter: drop-shadow(0 8px 18px rgba(155, 188, 255, .2));
    }

    .head {
      position: absolute;
      top: 0;
      left: 50%;
      width: 34px;
      height: 46px;
      transform: translateX(-50%);
      border-radius: 50% 50% 44% 44%;
      background: linear-gradient(145deg, #eff5ff, #afbee8 70%, #8294c8);
    }

    .torso {
      position: absolute;
      top: 43px;
      left: 50%;
      width: 72px;
      height: 110px;
      transform: translateX(-50%);
      border-radius: 28px 28px 24px 24px;
      background: linear-gradient(145deg, #eef5ff, #b7c5ec 70%, #8293c6);
    }

    .arm, .leg {
      position: absolute;
      transform-origin: top center;
      border-radius: 999px;
      background: linear-gradient(145deg, #eef5ff, #aebce8 72%, #7f90c5);
    }

    .arm {
      top: 60px;
      width: 17px;
      height: 118px;
    }

    .arm.left { left: 18px; transform: rotate(var(--left-arm, 10deg)); }
    .arm.right { right: 18px; transform: rotate(var(--right-arm, -10deg)); }

    .leg {
      top: 145px;
      width: 21px;
      height: 126px;
    }

    .leg.left { left: 42px; transform: rotate(5deg); }
    .leg.right { right: 42px; transform: rotate(-5deg); }

    .neck-model {
      position: relative;
      width: 190px;
      height: 230px;
      filter: drop-shadow(0 10px 24px rgba(155, 188, 255, .18));
    }

    .neck-cue {
      position: absolute;
      left: 50%;
      top: 18px;
      width: 168px;
      height: 120px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .neck-cue path,
    .neck-cue line {
      fill: none;
      stroke: #ff8a00;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-dasharray: 5 5;
    }

    .neck-cue .solid {
      stroke-dasharray: none;
      stroke: #13a8ff;
    }

    .neck-head {
      position: absolute;
      left: 78px;
      top: 0;
      width: 58px;
      height: 82px;
      border-radius: 50% 50% 44% 44%;
      transform: rotate(var(--neck-rot, 0deg)) translateX(var(--neck-x, 0));
      background: linear-gradient(145deg, #eef5ff, #aebce8 72%, #8293c7);
    }

    .neck-head::after {
      content: "";
      position: absolute;
      left: 28px;
      top: 16px;
      width: 4px;
      height: 38px;
      border-radius: 999px;
      background: rgba(255,255,255,.46);
      opacity: var(--face-op, 0);
      transform: translateX(var(--face-x, 0));
    }

    .neck-shoulder {
      position: absolute;
      left: 22px;
      top: 86px;
      width: 150px;
      height: 120px;
      border-radius: 72px 72px 14px 14px;
      background: linear-gradient(145deg, #eaf2ff, #aebce8 72%, #7f90c5);
    }

    .neck-model.side .neck-head {
      left: 74px;
      width: 68px;
      border-radius: 48% 52% 45% 55%;
      transform: rotate(var(--neck-rot, 0deg)) translate(var(--neck-x, 0), var(--neck-y, 0));
    }

    .neck-model.side .neck-shoulder {
      left: 48px;
      top: 92px;
      width: 98px;
      height: 118px;
      border-radius: 44px 58px 16px 16px;
      transform: skewX(-8deg);
    }

    .neck-model.rotate .neck-head {
      transform: rotate(var(--neck-rot, 0deg)) translateX(var(--neck-x, 0)) scaleX(var(--neck-scale-x, 1));
    }

    .angle-text {
      position: absolute;
      top: 88px;
      color: #cbd3dc;
      font-size: 15px;
    }

    .angle-text.left { left: 28px; }
    .angle-text.right { right: 28px; }

    .success {
      position: absolute;
      top: 108px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #041204;
      background: var(--green);
      font-size: 28px;
      font-weight: 800;
      opacity: 0;
    }

    .success.show { opacity: 1; }
    .success.left { left: 14px; }
    .success.right { right: 14px; }

    .demo-card {
      position: absolute;
      right: 0;
      bottom: 10px;
      width: 118px;
      min-height: 70px;
      padding: 10px;
      border-radius: 8px;
      color: #dce5ed;
      background: rgba(37, 47, 56, .9);
      font-size: 12px;
      line-height: 1.45;
    }

    .demo-card b {
      display: block;
      color: #fff;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .apose-demo {
      position: absolute;
      right: 0;
      top: 6px;
      width: 96px;
      height: 134px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: #e7eef7;
      font-size: 12px;
      line-height: 1.35;
      overflow: hidden;
    }

    .apose-demo::before {
      content: none;
    }

    .apose-demo b {
      display: none;
      margin: 2px 0 7px;
      color: #fff;
      font-size: 13px;
    }

    .apose-demo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: .98;
      filter: none;
    }

    .apose-frame-wrap {
      position: absolute;
      left: 0;
      right: 0;
      top: 8px;
      bottom: 0;
      display: grid;
      place-items: center;
    }

    .apose-frame-wrap.scan-center {
      inset: 0;
      right: 0;
    }

    .apose-frame {
      width: 238px;
      height: 304px;
      position: relative;
      overflow: visible;
      border-radius: 12px;
      background: transparent;
    }

    .apose-frame.pass {
      background: transparent;
    }

    .apose-frame.scan-mode {
      width: 260px;
      height: 350px;
      background: transparent;
    }

    .camera-feed {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 42px),
        linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 42px),
        radial-gradient(circle at 38% 26%, rgba(255,255,255,.12), transparent 16%),
        radial-gradient(circle at 68% 62%, rgba(255,255,255,.08), transparent 20%);
      opacity: .75;
    }

    .apose-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .apose-outline-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: .98;
      transition: filter .24s ease, opacity .24s ease;
      z-index: 1;
    }

    .apose-outline-img.pass {
      opacity: .98;
      filter: none;
    }

    .apose-outline-img.scan-asset {
      filter: none;
    }

    .arm-trace-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 3;
    }

    .arm-trace-layer path,
    .arm-guide-layer line {
      fill: none;
      stroke: #ff3b3b;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 6 7;
      filter: drop-shadow(0 0 5px rgba(255, 59, 59, .75));
    }

    .arm-guide-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 3;
    }

    .arm-range-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 2;
    }

    .arm-range-shape {
      fill: rgba(196, 226, 36, .34);
      stroke: rgba(215, 245, 56, .48);
      stroke-width: 1;
      filter: drop-shadow(0 0 16px rgba(205, 238, 40, .72));
    }

    .guide-check {
      opacity: 0;
      animation: show-guide-check .28s ease-out 1.42s both;
      filter: drop-shadow(0 0 8px rgba(0, 210, 40, .7));
    }

    .guide-circle {
      fill: #00c820;
    }

    .guide-check-mark {
      fill: none;
      stroke: #062b08;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes show-guide-check {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .apose-outline-mask {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #35df75;
      opacity: 0;
      -webkit-mask: url("assets/apose-outline.png") center / contain no-repeat;
      mask: url("assets/apose-outline.png") center / contain no-repeat;
      filter:
        drop-shadow(0 0 10px rgba(53, 223, 117, .9))
        drop-shadow(0 0 24px rgba(53, 223, 117, .55));
      transition: opacity .24s ease;
    }

    .apose-outline-mask.show {
      opacity: 0;
    }

    .camera-note {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: 150px;
      text-align: center;
      color: #cbd5df;
      font-size: 12px;
      line-height: 1.45;
    }

    .pass-toast {
      position: absolute;
      left: 50%;
      bottom: -30px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f3f9ff;
      font-size: 13px;
      white-space: nowrap;
    }

    .ready-count {
      position: absolute;
      left: 50%;
      top: -58px;
      transform: translateX(-50%);
      width: auto;
      height: auto;
      display: grid;
      place-items: center;
      color: #fff;
      background: transparent;
      border: 0;
      box-shadow: none;
      font-size: 52px;
      font-weight: 400;
      line-height: 1;
      text-shadow: 0 0 16px rgba(255, 255, 255, .3);
    }

    .hold-ring {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid rgba(0, 168, 255, .24);
      border-top-color: #00a8ff;
      animation: spin 1.2s linear infinite;
    }

    .scan-ring {
      position: absolute;
      width: 128px;
      height: 58px;
      left: 50%;
      top: 162px;
      bottom: auto;
      border: 7px solid rgba(0, 148, 255, .88);
      border-left-color: transparent;
      border-radius: 50%;
      transform: translateX(-50%) rotateX(62deg);
      animation: spin-flat 2s linear infinite;
    }

    .scan-ring::after {
      content: "360°";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotateX(-62deg);
      color: #2ca8ff;
      font-size: 30px;
      font-weight: 600;
      text-shadow: 0 0 14px rgba(0, 148, 255, .8);
    }

    .scan-line {
      position: absolute;
      left: 18px;
      right: 18px;
      height: 2px;
      top: 122px;
      background: linear-gradient(90deg, transparent, #18d8e7, transparent);
      box-shadow: 0 0 14px rgba(0, 168, 255, .8);
      animation: scan-line 1.8s ease-in-out infinite alternate;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes spin-flat {
      to { transform: translateX(-50%) rotateX(62deg) rotateZ(360deg); }
    }

    @keyframes scan-line {
      from { transform: translateY(0); opacity: .4; }
      to { transform: translateY(120px); opacity: 1; }
    }

    .hint {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 48px;
      min-height: 96px;
      padding: 32px 18px 17px;
      border-radius: 8px;
      color: #e8ebef;
      background: var(--panel);
      font-size: 14px;
      line-height: 1.75;
    }

    .hint.dark { background: var(--panel-dark); }

    .info {
      position: absolute;
      left: 18px;
      top: -18px;
      width: 41px;
      height: 35px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: var(--blue);
      color: #fff;
      font-size: 23px;
      font-weight: 700;
      font-family: Arial, sans-serif;
    }

    .hint-line {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .hint-line + .hint-line { margin-top: 4px; }

    .dot {
      width: 8px;
      height: 8px;
      margin-top: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--orange);
    }

    .summary {
      margin-top: 34px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 16px 12px;
      border-radius: 8px;
      background: var(--panel-dark);
    }

    .summary div {
      padding: 12px 8px;
      border-radius: 6px;
      text-align: center;
      color: #dfe7ef;
      background: rgba(255,255,255,.04);
      font-size: 13px;
    }

    .summary span {
      display: block;
      margin-top: 7px;
      color: var(--cyan);
      font-size: 15px;
    }

    .done-copy {
      margin-top: 34px;
      text-align: center;
      font-size: 16px;
    }

    .done-actions {
      margin: 34px 48px 0;
      display: flex;
      justify-content: space-between;
      color: #dce5ef;
      font-size: 14px;
    }

    .wait-result {
      display: grid;
      place-items: center;
      gap: 18px;
      color: #eef5ff;
      font-size: 18px;
      text-align: center;
    }

    .wait-spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid rgba(0, 132, 255, .2);
      border-top-color: #1687f7;
      animation: spin 1.1s linear infinite;
    }

    .placeholder {
      margin-top: 80px;
      padding: 28px 24px;
      border-radius: 10px;
      background: var(--panel);
      color: #e6edf4;
      text-align: center;
      line-height: 1.7;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button.control {
      min-width: 84px;
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    button.control.secondary { background: #2b333b; }
    button.control:disabled { opacity: .45; cursor: default; }

    .state-name {
      width: 100%;
      text-align: center;
      color: #56616c;
      font-size: 13px;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="phone">
    <section class="screen">
      <div class="status">
        <span>18:32</span>
        <div class="sys-icons" aria-hidden="true">
          <span class="sig"></span>
          <span class="sig"></span>
          <span class="battery"></span>
        </div>
      </div>

      <div id="projectPage">
        <div class="back">← 首页</div>
        <h1>选择测量项目</h1>
        <div class="project-list">
          <button class="project-card primary" data-route="body">
            <div class="project-name">体态体围</div>
            <div class="project-desc">请自然站立<br>保持静止 2 秒</div>
            <div class="project-figure">
              <div class="person" style="--left-arm:10deg;--right-arm:-10deg">
                <div class="head"></div><div class="torso"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div>
              </div>
            </div>
          </button>
          <button class="project-card" data-route="shoulder">
            <div class="project-name">肩部功能</div>
            <div class="project-desc">了解您的肩关节灵活度信息</div>
            <div class="project-small-figure">╲○</div>
          </button>
          <button class="project-card" data-route="neck">
            <div class="project-name">颈部功能</div>
            <div class="project-desc">了解您的颈椎活动度信息</div>
            <div class="project-small-figure">◔</div>
          </button>
        </div>
        <div class="home-timer">
          <div><strong>60</strong> 秒后返回首页</div>
          <div class="bottom-line"></div>
        </div>
      </div>

      <div id="measurePage" hidden>
        <div class="back" id="backToProjects">← 项目选择</div>
        <h2 class="measure-title" id="measureTitle">肩部合并测量</h2>
        <div class="sub">
          <span id="stateLabel">校准中...</span>
          <span class="progress-mini">
            <span class="rail"><span class="fill"></span></span>
            <span id="progressText">--</span>
          </span>
        </div>
        <div class="stepbar" id="stepbar"></div>
        <div class="countdown" id="countdown" hidden>3</div>
        <div class="stage" id="stage"></div>
        <div class="hint" id="hint">
          <div class="info">i</div>
          <div id="hintLines"></div>
        </div>
        <div class="bottom-timer" id="bottomTimer" hidden>
          <div><strong>30</strong> 秒后将结束测量</div>
          <div class="bottom-line"></div>
        </div>
      </div>
    </section>
  </main>

  <nav class="controls">
    <button class="control secondary" id="prevBtn" hidden>上一步</button>
    <button class="control" id="nextBtn" hidden>下一步</button>
    <button class="control secondary" id="resetBtn" hidden>重置</button>
    <div class="state-name" id="stateName">项目选择</div>
  </nav>

  <script>
    const $ = (id) => document.getElementById(id);

    const flowData = {
      shoulder: {
        title: "肩部测量",
        labels: ["外展上举-左", "外展上举-右", "前屈上举-左", "前屈上举-右"],
        valuesDone: ["164.5°", "170.0°", "177.0°", "179.5°"],
        doneCopy: "本次肩部测量已全部完成",
        states: [
          { id: "SH_CALIB", label: "校准中...", active: 0, values: ["--","--","--","--"], hint: ["请面向屏幕，双脚站稳，双臂自然下垂。"], pose: "body-neutral", p: 0 },
          { id: "SH_CD3", label: "即将开始", active: 0, values: ["--","--","--","--"], hint: ["请保持身体静止；倒计时结束后将测量外展上举-左。"], countdown: "3", p: 0 },
          { id: "SH_CD2", label: "即将开始", active: 0, values: ["--","--","--","--"], hint: ["请保持身体静止；倒计时结束后将测量外展上举-左。"], countdown: "2", p: 0 },
          { id: "SH_CD1", label: "即将开始", active: 0, values: ["--","--","--","--"], hint: ["请保持身体静止；倒计时结束后将测量外展上举-左。"], countdown: "1", p: 0 },
          { id: "SH_M1", label: "测量中", active: 0, values: ["158.0°","--","--","--"], hint: ["左手向左伸直，掌心朝内，缓慢展开上举至最高处，并停止2秒。"], pose: "left-abduction", demo: "外展上举-左循环", timer: true, p: 25 },
          { id: "SH_OK1", label: "测量成功", active: 0, done: [0], values: ["164.5°","--","--","--"], hint: ["很好，请缓慢放下左手。"], pose: "left-abduction", success: "left", demo: "外展上举-左", p: 25 },
          { id: "SH_M2", label: "测量中", active: 1, done: [0], values: ["164.5°","168.0°","--","--"], hint: ["右手向右伸直，掌心朝内，缓慢展开上举至最高处，并停止2秒。"], pose: "right-abduction", demo: "外展上举-右循环", timer: true, p: 50 },
          { id: "SH_OK2", label: "测量成功", active: 1, done: [0,1], values: ["164.5°","170.0°","--","--"], hint: ["很好，请缓慢放下右手。"], pose: "right-abduction", success: "right", demo: "外展上举-右", p: 50 },
          { id: "SH_TRANS", label: "准备前屈上举", active: 2, done: [0,1], values: ["164.5°","170.0°","--","--"], hint: ["外展上举测量已完成。接下来进入前屈上举测量，请将双臂自然下垂。"], pose: "body-neutral", demo: "即将切换前屈上举", p: 50 },
          { id: "SH_M3", label: "测量中", active: 2, done: [0,1], values: ["164.5°","170.0°","132.0°","--"], hint: ["左手向前伸直，掌心朝内，缓慢展开上举至最高处，并停止2秒。"], pose: "left-flexion", demo: "前屈上举-左循环", timer: true, p: 75 },
          { id: "SH_OK3", label: "测量成功", active: 2, done: [0,1,2], values: ["164.5°","170.0°","177.0°","--"], hint: ["很好，请缓慢放下左手。"], pose: "left-flexion", success: "left", demo: "前屈上举-左", p: 75 },
          { id: "SH_M4", label: "测量中", active: 3, done: [0,1,2], values: ["164.5°","170.0°","177.0°","175.0°"], hint: ["右手向前伸直，掌心朝内，缓慢展开上举至最高处，并停止2秒。"], pose: "right-flexion", demo: "前屈上举-右循环", timer: true, p: 100 },
          { id: "SH_OK4", label: "测量成功", active: 3, done: [0,1,2,3], values: ["164.5°","170.0°","177.0°","179.5°"], hint: ["很好，请缓慢放下右手。"], pose: "right-flexion", success: "right", demo: "前屈上举-右", p: 100 },
          { id: "SH_DONE", label: "已完成", donePage: true, p: 100 }
        ]
      },
      neck: {
        title: "颈部测量",
        labels: ["前屈后伸", "左右侧屈", "左右旋转"],
        valuesDone: ["完成", "完成", "完成"],
        doneCopy: "颈部测量已完成。",
        states: [
          { id: "NK_CALIB", label: "校准中...", active: 0, values: ["--","--","--"], hint: ["请平视前方，肩膀以下部位保持静止。"], pose: "neck-neutral", p: 0 },
          { id: "NK_CD3", label: "即将开始", active: 0, values: ["--","--","--"], hint: ["请保持身体和头部静止；倒计时结束后将测量颈部活动度。"], countdown: "3", p: 0 },
          { id: "NK_CD2", label: "即将开始", active: 0, values: ["--","--","--"], hint: ["请保持身体和头部静止；倒计时结束后将测量颈部活动度。"], countdown: "2", p: 0 },
          { id: "NK_CD1", label: "即将开始", active: 0, values: ["--","--","--"], hint: ["请保持身体和头部静止；倒计时结束后将测量颈部活动度。"], countdown: "1", p: 0 },
          { id: "NK_M1", label: "测量中", active: 0, values: ["测量中","--","--"], hint: ["低头，让下巴靠近胸口。", "保持肩膀以下不动。"], pose: "neck-flexion", timer: true, p: 16 },
          { id: "NK_M2", label: "测量中", active: 0, values: ["测量中","--","--"], hint: ["抬头向后仰到最大角度。", "保持肩膀以下不动。"], pose: "neck-extension", timer: true, p: 32 },
          { id: "NK_RETURN1", label: "回正提示", active: 1, done: [0], values: ["完成","--","--"], hint: ["很好，请缓慢将头部回到正中。"], pose: "neck-neutral", p: 36 },
          { id: "NK_M3", label: "测量中", active: 1, done: [0], values: ["完成","测量中","--"], hint: ["头部向左侧倾斜，让左耳靠近左肩。", "保持肩膀不动。"], pose: "neck-left-bend", timer: true, p: 50 },
          { id: "NK_M4", label: "测量中", active: 1, done: [0], values: ["完成","测量中","--"], hint: ["头部向右侧倾斜，让右耳靠近右肩。", "保持肩膀不动。"], pose: "neck-right-bend", timer: true, p: 64 },
          { id: "NK_RETURN2", label: "回正提示", active: 2, done: [0,1], values: ["完成","完成","--"], hint: ["很好，请缓慢将头部回到正中。"], pose: "neck-neutral", p: 68 },
          { id: "NK_M5", label: "测量中", active: 2, done: [0,1], values: ["完成","完成","测量中"], hint: ["头部向左转，看向左侧最大角度。", "保持肩膀以下不动。"], pose: "neck-left-rotate", timer: true, p: 84 },
          { id: "NK_M6", label: "测量中", active: 2, done: [0,1], values: ["完成","完成","测量中"], hint: ["头部向右转，看向右侧最大角度。", "保持肩膀以下不动。"], pose: "neck-right-rotate", timer: true, p: 100 },
          { id: "NK_DONE", label: "已完成", donePage: true, p: 100 }
        ]
      }
    };

    const bodyFlow = {
      title: "体态体围测量",
      states: [
        {
          id: "APOSE_ALIGN",
          label: "姿势对齐中",
          hint: ["双手握拳，手臂向身体两侧打开；", "请调整双臂角度，尽量贴近屏幕中的姿势。"],
          bodyKind: "align",
          p: 12
        },
        {
          id: "APOSE_PARTIAL",
          label: "姿势对齐中",
          hint: ["双手握拳，手臂向身体两侧打开；", "请调整双臂角度，尽量贴近屏幕中的姿势。"],
          bodyKind: "partial",
          p: 24
        },
        {
          id: "APOSE_READY_3",
          label: "姿势已对齐",
          hint: ["姿势正确，请保持双臂位置不变；", "倒计时结束后转台将开始旋转扫描。"],
          bodyKind: "ready",
          readyCountdown: "3",
          p: 34
        },
        {
          id: "APOSE_READY_2",
          label: "姿势已对齐",
          hint: ["姿势正确，请保持双臂位置不变；", "倒计时结束后转台将开始旋转扫描。"],
          bodyKind: "ready",
          readyCountdown: "2",
          p: 44
        },
        {
          id: "APOSE_READY_1",
          label: "姿势已对齐",
          hint: ["姿势正确，请保持双臂位置不变；", "倒计时结束后转台将开始旋转扫描。"],
          bodyKind: "ready",
          readyCountdown: "1",
          p: 54
        },
        {
          id: "SCAN_360",
          label: "旋转扫描中",
          hint: ["测量中，请保持双臂位置不变，身体和头部不要移动。"],
          bodyKind: "scan",
          p: 78
        },
        {
          id: "WAIT_RESULT",
          label: "生成结果中",
          hint: ["请等待测量结果…"],
          bodyKind: "wait",
          p: 92
        },
        {
          id: "DONE",
          label: "已完成",
          bodyKind: "done",
          p: 100
        }
      ]
    };

    let route = "projects";
    let currentFlow = null;
    let stateIndex = 0;
    let bodyHintTimer = null;

    function bodyPerson(pose = "body-neutral", angleResults = null) {
      const style = poseStyle(pose);
      return `
        <div class="orbit"></div>
        <div class="angle-line" style="--line-rot:${style.line};--line-op:${style.lineOp}"></div>
        ${angleResults && angleResults.left ? `<div class="shoulder-angle-result left">${angleResults.left}</div>` : ""}
        ${angleResults && angleResults.right ? `<div class="shoulder-angle-result right">${angleResults.right}</div>` : ""}
        <div class="success left ${style.success === "left" ? "show" : ""}">✓</div>
        <div class="success right ${style.success === "right" ? "show" : ""}">✓</div>
        <div class="person" style="--left-arm:${style.left};--right-arm:${style.right}">
          <div class="head"></div><div class="torso"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div>
        </div>`;
    }

    function neckModel(pose = "neck-neutral", success = "") {
      const style = neckStyle(pose);
      return `
        <div class="orbit"></div>
        <div class="angle-line" style="--line-rot:${style.line};--line-op:${style.lineOp}"></div>
        ${style.showAngles ? `<div class="angle-text left">37.0°</div><div class="angle-text right">37.0°</div>` : ""}
        ${style.cue}
        <div class="success left ${success === "left" ? "show" : ""}">✓</div>
        <div class="success right ${success === "right" ? "show" : ""}">✓</div>
        <div class="neck-model ${style.view}" style="--face-op:${style.faceOp};--face-x:${style.faceX};--neck-scale-x:${style.scaleX}">
          <div class="neck-shoulder"></div>
          <div class="neck-head" style="--neck-rot:${style.rot};--neck-x:${style.x};--neck-y:${style.y}"></div>
        </div>`;
    }

    function poseStyle(pose) {
      const base = { left: "10deg", right: "-10deg", line: "0deg", lineOp: 0 };
      return {
        "body-neutral": base,
        "left-abduction": { left: "-148deg", right: "-10deg", line: "-24deg", lineOp: 1 },
        "right-abduction": { left: "10deg", right: "148deg", line: "24deg", lineOp: 1 },
        "left-flexion": { left: "-172deg", right: "-10deg", line: "-5deg", lineOp: 1 },
        "right-flexion": { left: "10deg", right: "172deg", line: "5deg", lineOp: 1 }
      }[pose] || base;
    }

    function neckStyle(pose) {
      const sideForwardCue = `<svg class="neck-cue" viewBox="0 0 168 120" aria-hidden="true"><path d="M92 22 C70 40 58 64 54 94"/><path d="M54 94 l-6 -12 M54 94 l9 -8"/></svg>`;
      const sideBackCue = `<svg class="neck-cue" viewBox="0 0 168 120" aria-hidden="true"><path d="M78 28 C102 42 116 66 120 96"/><path d="M120 96 l-9 -9 M120 96 l6 -12"/></svg>`;
      const bendLeftCue = `<svg class="neck-cue" viewBox="0 0 168 120" aria-hidden="true"><path d="M86 26 C66 36 54 52 48 74"/><path d="M48 74 l-4 -12 M48 74 l11 -5"/></svg>`;
      const bendRightCue = `<svg class="neck-cue" viewBox="0 0 168 120" aria-hidden="true"><path d="M82 26 C102 36 114 52 120 74"/><path d="M120 74 l-11 -5 M120 74 l4 -12"/></svg>`;
      const rotateLeftCue = `<svg class="neck-cue" viewBox="0 0 168 120" aria-hidden="true"><path class="solid" d="M112 44 C92 28 65 30 48 48"/><path class="solid" d="M48 48 l12 -2 M48 48 l5 -11"/></svg>`;
      const rotateRightCue = `<svg class="neck-cue" viewBox="0 0 168 120" aria-hidden="true"><path class="solid" d="M56 44 C76 28 103 30 120 48"/><path class="solid" d="M120 48 l-12 -2 M120 48 l-5 -11"/></svg>`;
      const base = { rot: "0deg", x: "0px", y: "0px", line: "0deg", lineOp: 0, view: "front", faceOp: 0, faceX: "0px", scaleX: 1, showAngles: false, cue: "" };
      return {
        "neck-neutral": base,
        "neck-flexion": { ...base, view: "side", rot: "26deg", x: "-8px", y: "12px", line: "-34deg", lineOp: 1, cue: sideForwardCue },
        "neck-extension": { ...base, view: "side", rot: "-24deg", x: "10px", y: "-6px", line: "34deg", lineOp: 1, cue: sideBackCue },
        "neck-left-bend": { ...base, rot: "-22deg", x: "-8px", line: "-38deg", lineOp: 1, showAngles: true, cue: bendLeftCue },
        "neck-right-bend": { ...base, rot: "22deg", x: "8px", line: "38deg", lineOp: 1, showAngles: true, cue: bendRightCue },
        "neck-left-rotate": { ...base, view: "rotate", rot: "-4deg", x: "-18px", scaleX: .72, line: "-38deg", lineOp: 1, faceOp: 1, faceX: "-9px", showAngles: true, cue: rotateLeftCue },
        "neck-right-rotate": { ...base, view: "rotate", rot: "4deg", x: "18px", scaleX: .72, line: "38deg", lineOp: 1, faceOp: 1, faceX: "9px", showAngles: true, cue: rotateRightCue }
      }[pose] || base;
    }

    function renderProjectPage() {
      $("projectPage").hidden = false;
      $("measurePage").hidden = true;
      $("prevBtn").hidden = true;
      $("nextBtn").hidden = true;
      $("resetBtn").hidden = true;
      $("stateName").textContent = "项目选择";
    }

    function openFlow(name) {
      route = name;
      currentFlow = name === "body" ? bodyFlow : flowData[name];
      stateIndex = 0;
      renderMeasure();
    }

    function renderMeasure() {
      clearTimeout(bodyHintTimer);
      const flow = currentFlow;
      const state = flow.states[stateIndex];
      $("projectPage").hidden = true;
      $("measurePage").hidden = false;
      document.querySelector(".progress-mini").hidden = false;
      $("measureTitle").textContent = flow.title;
      $("stateLabel").textContent = route === "shoulder" ? "" : state.label || "";
      $("progressText").textContent = state.donePage ? "4/4" : state.countdown ? "--" : state.p ? `${state.p / 25}/4` : "--";
      document.querySelector(".progress-mini").hidden = route === "shoulder";
      document.documentElement.style.setProperty("--p", `${state.p || 0}%`);
      $("stateName").textContent = state.id;
      $("prevBtn").hidden = false;
      $("nextBtn").hidden = false;
      $("resetBtn").hidden = false;
      $("prevBtn").disabled = stateIndex === 0;
      $("nextBtn").disabled = stateIndex === flow.states.length - 1;
      $("nextBtn").textContent = stateIndex === flow.states.length - 1 ? "已完成" : "下一步";

      if (route === "body") {
        renderBodyMeasure(state);
        return;
      }

      ensureStepbar();
      $("stepbar").hidden = Boolean(state.countdown || state.donePage);
      $("countdown").hidden = !state.countdown;
      $("countdown").textContent = state.countdown || "";
      $("stage").hidden = Boolean(state.countdown || state.donePage);
      $("hint").hidden = Boolean(state.donePage);
      $("bottomTimer").hidden = !state.timer;
      $("hint").classList.toggle("dark", route === "neck");

      if (state.donePage) {
        $("stepbar").hidden = false;
        $("stepbar").className = "";
        $("stepbar").innerHTML = `<div class="summary">${flow.labels.map((label, i) => `<div>${label}<span>${flow.valuesDone[i]}</span></div>`).join("")}</div><div class="done-copy">${flow.doneCopy}</div><div class="done-actions"><span>[ 返回 ]</span><span>[ 下一项 ]</span></div>`;
        $("countdown").hidden = true;
        $("stage").hidden = true;
        $("hint").hidden = true;
        $("bottomTimer").hidden = true;
        return;
      }

      renderStepbar(flow, state);
      renderHint(state.hint || []);
      renderStage(state);
    }

    function renderBodyMeasure(state) {
      ensureStepbar();
      $("measureTitle").textContent = "体围测量";
      $("stateLabel").textContent = "";
      $("progressText").textContent = "";
      document.querySelector(".progress-mini").hidden = true;
      document.documentElement.style.setProperty("--p", `${state.p || 0}%`);
      $("stepbar").hidden = true;
      $("countdown").hidden = !state.countdown;
      $("countdown").textContent = state.countdown || "";
      $("stage").hidden = Boolean(state.countdown || state.bodyKind === "done");
      $("hint").hidden = state.bodyKind === "done";
      $("hint").classList.remove("dark");
      $("bottomTimer").hidden = state.bodyKind !== "align";

      if (state.bodyKind === "done") {
        $("stepbar").hidden = false;
        $("stepbar").className = "";
        $("stepbar").innerHTML = `<div class="summary"><div>体围测量<span>已完成</span></div><div>测量结果<span>已生成</span></div></div><div class="done-copy">测量结果已生成</div><div class="done-actions"><span>[ 查看报告 ]</span><span>[ 返回 ]</span></div>`;
        $("countdown").hidden = true;
        $("stage").hidden = true;
        $("hint").hidden = true;
        $("bottomTimer").hidden = true;
        return;
      }

      if (state.bodyKind === "wait") {
        $("stage").className = "stage wait-stage";
        $("stage").innerHTML = `<div class="wait-result"><div class="wait-spinner"></div><div>请等待测量结果…</div></div>`;
        $("hint").hidden = true;
        $("bottomTimer").hidden = true;
        return;
      }

      if (state.bodyKind === "scan") {
        $("stage").className = "stage scan-stage";
        $("stage").innerHTML = aposeAlign(true, "scan");
        renderHint(state.hint || []);
        $("bottomTimer").hidden = true;
        return;
      }

      if (state.bodyKind === "align" || state.bodyKind === "partial" || state.bodyKind === "ready") {
        $("stage").className = "stage apose-stage";
        $("stage").innerHTML = aposeAlign(state.bodyKind === "ready", state.bodyKind === "partial" ? "partial" : "align", state.readyCountdown);
        renderHint(state.hint || []);
        if (state.bodyKind === "partial") {
          const expectedIndex = stateIndex;
          bodyHintTimer = setTimeout(() => {
            if (route === "body" && stateIndex === expectedIndex) {
              renderHint(["姿势正确，请保持双臂位置不变；", "倒计时结束后转台将开始旋转扫描。"]);
            }
          }, 1450);
        }
        return;
      }

      renderHint(state.hint || []);
    }

    function ensureStepbar() {
      const el = $("stepbar");
      if (!el.classList.contains("stepbar")) {
        el.className = "stepbar";
      }
    }

    function renderStepbar(flow, state) {
      if (route === "shoulder") {
        const activeStage = state.active >= 2 ? 1 : 0;
        const doneStages = new Set();
        if ((state.done || []).some(i => i === 0 || i === 1) || state.active >= 2 || state.donePage) doneStages.add(0);
        if ((state.done || []).some(i => i === 2 || i === 3) || state.donePage) doneStages.add(1);
        $("stepbar").className = "stepbar shoulder-stagebar";
        $("stepbar").innerHTML = ["外展上举", "前屈上举"].map((label, i) => {
          const active = activeStage === i && !state.donePage ? "active" : "";
          const done = doneStages.has(i) ? "done" : "";
          const mark = active ? `<span class="mark">●&gt;&gt;</span>` : "";
          const check = done ? " ✓" : "";
          return `<div class="step ${active} ${done}"><div class="label">${mark}${label}${check}</div></div>`;
        }).join("");
        return;
      }

      $("stepbar").className = "stepbar";
      $("stepbar").innerHTML = flow.labels.map((label, i) => {
        const active = state.active === i ? "active" : "";
        const done = (state.done || []).includes(i) ? "done" : "";
        const mark = state.active === i ? `<span class="mark">●&gt;&gt;</span>` : "";
        const check = (state.done || []).includes(i) ? " ✓" : "";
        return `<div class="step ${active} ${done}"><div class="label">${mark}${label}${check}</div><div class="value">${state.values[i]}</div></div>`;
      }).join("");
    }

    function renderHint(lines) {
      $("hintLines").innerHTML = lines.map(line => `<div class="hint-line"><span class="dot"></span><span>${line}</span></div>`).join("");
    }

    function renderStage(state) {
      const isNeck = route === "neck";
      $("stage").className = isNeck ? "stage neck-stage" : "stage";
      $("stage").innerHTML = isNeck ? neckModel(state.pose, state.success) : bodyPerson(state.pose, shoulderAngleResults(state));
      if (state.success && !isNeck) {
        $("stage").querySelector(`.success.${state.success}`).classList.add("show");
      }
      if (state.demo) {
        $("stage").insertAdjacentHTML("beforeend", `<div class="demo-card"><b>示范</b>${state.demo}</div>`);
      }
    }

    function shoulderAngleResults(state) {
      if (route !== "shoulder" || !state.values) return null;
      const isFlexion = state.active >= 2;
      const left = state.values[isFlexion ? 2 : 0];
      const right = state.values[isFlexion ? 3 : 1];
      return {
        left: left && left !== "--" ? left : "",
        right: right && right !== "--" ? right : ""
      };
    }

    function aposeAlign(pass, mode = "align", countdown = "") {
      const isScan = mode === "scan";
      const src = isScan ? "assets/body-scan-model-current.png" : "assets/apose-align-model.png";
      const alt = isScan ? "体围测量 360 度扫描模型" : "A-Pose 人形对齐线框";
      return `
        ${isScan || pass || mode === "align" || mode === "partial" ? "" : `<div class="apose-demo">
          <img class="apose-demo-img" src="assets/apose-ready-green.png" alt="A-Pose 示范图" />
        </div>`}
        <div class="apose-frame-wrap ${isScan ? "scan-center" : ""}">
          <div class="apose-frame ${pass ? "pass" : ""} ${isScan ? "scan-mode" : ""}">
            ${(mode === "align" || mode === "partial") && !pass ? `<svg class="arm-range-layer" viewBox="0 0 238 304" aria-hidden="true">
              <path class="arm-range-shape" d="M 70 86 C 48 116 34 145 27 178 C 42 171 57 158 69 140 C 79 124 87 105 92 88 Z" />
              <path class="arm-range-shape" d="M 168 88 C 190 118 204 147 211 178 C 196 171 181 158 169 140 C 159 124 151 106 146 90 Z" />
            </svg>` : ""}
            <img class="apose-outline-img ${pass ? "pass" : ""} ${isScan ? "scan-asset" : ""}" src="${src}" alt="${alt}" />
            ${mode === "align" && !pass ? `<svg class="arm-trace-layer" viewBox="0 0 238 304" aria-hidden="true">
              <path d="M 87 70 L 87 178" />
              <path d="M 151 72 L 151 178" />
            </svg>` : ""}
            ${mode === "partial" ? `<svg class="arm-guide-layer" viewBox="0 0 238 304" aria-hidden="true">
              <line x1="87" y1="70" x2="87" y2="178">
                <animate attributeName="x2" from="87" to="41" dur="1.45s" fill="freeze" />
                <animate attributeName="y2" from="178" to="164" dur="1.45s" fill="freeze" />
              </line>
              <line x1="151" y1="72" x2="151" y2="178">
                <animate attributeName="x2" from="151" to="197" dur="1.45s" fill="freeze" />
                <animate attributeName="y2" from="178" to="164" dur="1.45s" fill="freeze" />
              </line>
              <g class="guide-check" transform="translate(36 172)">
                <circle class="guide-circle" cx="0" cy="0" r="16" />
                <path class="guide-check-mark" d="M -8 0 L -2 7 L 10 -8" />
              </g>
              <g class="guide-check" transform="translate(202 172)">
                <circle class="guide-circle" cx="0" cy="0" r="16" />
                <path class="guide-check-mark" d="M -8 0 L -2 7 L 10 -8" />
              </g>
            </svg>` : ""}
            ${isScan ? "" : ""}
            ${countdown ? `<div class="ready-count">${countdown}</div>` : ""}
          </div>
        </div>`;
    }

    document.querySelectorAll("[data-route]").forEach(btn => {
      btn.addEventListener("click", () => openFlow(btn.dataset.route));
    });

    $("backToProjects").addEventListener("click", renderProjectPage);
    $("prevBtn").addEventListener("click", () => { stateIndex = Math.max(0, stateIndex - 1); renderMeasure(); });
    $("nextBtn").addEventListener("click", () => { stateIndex = Math.min(currentFlow.states.length - 1, stateIndex + 1); renderMeasure(); });
    $("resetBtn").addEventListener("click", () => { stateIndex = 0; renderMeasure(); });

    renderProjectPage();
  </script>
</body>
</html>
